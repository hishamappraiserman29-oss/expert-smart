name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: expert-smart/api

jobs:
  # ── Lane 1: Governed MV + Wave 4B1 security (NO scikit-learn) ────────────────
  test-governed:
    name: Governed MV + Wave 4B1 Security
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      JWT_SECRET: ci-test-secret
      ADMIN_USER_IDS: admin-test-id
      RATE_LIMIT_ENABLED: "false"
      AVM_ARTIFACT_ROOT: /tmp/expert_smart_avm_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install base dependencies (no scikit-learn)
        working-directory: ${{ github.workspace }}
        run: |
          pip install --no-cache-dir -r core_engine/requirements.txt
          pip install -r requirements-dev.txt

      - name: Assert scikit-learn absent in governed environment
        working-directory: ${{ github.workspace }}
        shell: python
        run: |
          import importlib.util, sys
          spec = importlib.util.find_spec("sklearn")
          if spec is not None:
              print(f"FAIL: scikit-learn is importable in the governed environment: {spec.origin}")
              sys.exit(1)
          print("sklearn absent — governed isolation confirmed")

      - name: Secret guard — reject committed credentials
        working-directory: ${{ github.workspace }}
        shell: python
        run: |
          import sys, pathlib, re, subprocess

          FAIL = False
          FORBIDDEN_NAMES = {"service_account.json", "credentials.json"}
          PEM_RE = re.compile(
              r"-----BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----[\r\n]"
          )
          SA_TYPE_RE = re.compile(r'"type"\s*:\s*"service_account"')
          TEXT_EXTS = {".py", ".txt", ".md", ".yml", ".yaml", ".toml", ".cfg", ".sh"}

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for path_str in tracked:
              p = pathlib.Path(path_str)
              if p.name in FORBIDDEN_NAMES:
                  print(f"FAIL: credential file tracked: {path_str}")
                  FAIL = True
                  continue
              if p.name.startswith(".env") and p.name != ".env.example":
                  print(f"FAIL: .env file tracked: {path_str}")
                  FAIL = True
                  continue
              if p.suffix == ".db" and "data" in path_str:
                  print(f"FAIL: .db file tracked in data dir: {path_str}")
                  FAIL = True
                  continue
              if p.suffix in TEXT_EXTS:
                  try:
                      content = p.read_text(encoding="utf-8", errors="ignore")
                      if PEM_RE.search(content):
                          print(f"FAIL: PEM private key material in {path_str}")
                          FAIL = True
                  except Exception:
                      pass
              if p.suffix == ".json":
                  try:
                      content = p.read_text(encoding="utf-8", errors="ignore")
                      if SA_TYPE_RE.search(content):
                          print(f"FAIL: service_account type field in {path_str}")
                          FAIL = True
                  except Exception:
                      pass
          if FAIL:
              sys.exit(1)
          print("Secret guard passed — no credentials detected in tracked files.")

      - name: Collect governed MV + Wave 4B1 tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            core_engine/tests/test_mv_api.py \
            core_engine/tests/test_mv_audit_trail.py \
            core_engine/tests/test_mv_column_mapper.py \
            core_engine/tests/test_mv_data_splits.py \
            core_engine/tests/test_mv_db.py \
            core_engine/tests/test_mv_governance.py \
            core_engine/tests/test_mv_iaao_metrics.py \
            core_engine/tests/test_mv_import_endpoint.py \
            core_engine/tests/test_mv_interpretability.py \
            core_engine/tests/test_mv_model_quality.py \
            core_engine/tests/test_mv_outputs.py \
            core_engine/tests/test_mv_pipeline.py \
            core_engine/tests/test_mv_quality_checker.py \
            core_engine/tests/test_mv_reproducibility.py \
            core_engine/tests/test_mv_runner.py \
            core_engine/tests/test_mv_security.py \
            core_engine/tests/test_schema_validator.py \
            core_engine/tests/test_wave4b1_security.py \
            core_engine/tests/test_avm_artifact_lifecycle.py \
            core_engine/tests/test_wave4b1_waitress_transport.py \
            --collect-only -q

      - name: Run governed MV + Wave 4B1 security tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            core_engine/tests/test_mv_api.py \
            core_engine/tests/test_mv_audit_trail.py \
            core_engine/tests/test_mv_column_mapper.py \
            core_engine/tests/test_mv_data_splits.py \
            core_engine/tests/test_mv_db.py \
            core_engine/tests/test_mv_governance.py \
            core_engine/tests/test_mv_iaao_metrics.py \
            core_engine/tests/test_mv_import_endpoint.py \
            core_engine/tests/test_mv_interpretability.py \
            core_engine/tests/test_mv_model_quality.py \
            core_engine/tests/test_mv_outputs.py \
            core_engine/tests/test_mv_pipeline.py \
            core_engine/tests/test_mv_quality_checker.py \
            core_engine/tests/test_mv_reproducibility.py \
            core_engine/tests/test_mv_runner.py \
            core_engine/tests/test_mv_security.py \
            core_engine/tests/test_schema_validator.py \
            core_engine/tests/test_wave4b1_security.py \
            core_engine/tests/test_avm_artifact_lifecycle.py \
            core_engine/tests/test_wave4b1_waitress_transport.py \
            -q --tb=short

      - name: Run CI-safe requirements tests
        working-directory: ${{ github.workspace }}/core_engine
        run: |
          python -m pytest \
            tests/test_requirements_endpoint.py \
            tests/test_valuation_requirements.py \
            tests/test_asset_families.py \
            tests/test_purpose_integration_matrix.py \
            tests/test_purpose_routes.py \
            tests/test_approval_rules.py \
            -q --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: core_engine/coverage.xml
        continue-on-error: true

  # ── Lane 2: ML AVM (WITH scikit-learn) ────────────────────────────────────────
  test-ml-avm:
    name: ML AVM (scikit-learn)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      JWT_SECRET: ci-test-secret
      ADMIN_USER_IDS: admin-test-id
      RATE_LIMIT_ENABLED: "false"
      AVM_ARTIFACT_ROOT: /tmp/expert_smart_avm_ci_ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install base + ML dependencies
        working-directory: ${{ github.workspace }}
        run: |
          pip install --no-cache-dir -r core_engine/requirements.txt
          pip install -r requirements-dev.txt
          pip install -r core_engine/requirements-ml.txt

      - name: Assert scikit-learn version in ML environment
        working-directory: ${{ github.workspace }}
        shell: python
        run: |
          import importlib.util, importlib.metadata, sys
          spec = importlib.util.find_spec("sklearn")
          if spec is None:
              print("FAIL: scikit-learn not importable in ML environment")
              sys.exit(1)
          version = importlib.metadata.version("scikit-learn")
          if version != "1.9.0":
              print(f"FAIL: expected scikit-learn==1.9.0, got {version}")
              sys.exit(1)
          print(f"sklearn {version} confirmed in ML environment")

      - name: Collect ML AVM tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            core_engine/tests/test_ml_avm.py \
            --collect-only -q

      - name: Run ML AVM tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            core_engine/tests/test_ml_avm.py \
            -q --tb=short

  # ── Lane 3: Root mass-appraisal integration ────────────────────────────────────
  test-root-integration:
    name: Root Mass-Appraisal Integration
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      JWT_SECRET: ci-test-secret
      AVM_ARTIFACT_ROOT: /tmp/expert_smart_avm_ci_root

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install base dependencies (no scikit-learn)
        working-directory: ${{ github.workspace }}
        run: |
          pip install --no-cache-dir -r core_engine/requirements.txt
          pip install -r requirements-dev.txt

      - name: Collect root integration tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            tests/test_mass_appraisal_export_integration.py \
            tests/test_mass_appraisal_template_render.py \
            --collect-only -q

      - name: Run root mass-appraisal integration tests
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest \
            -p core_engine.tests.avm_isolation_plugin \
            tests/test_mass_appraisal_export_integration.py \
            tests/test_mass_appraisal_template_render.py \
            -q --tb=short

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check . --select=E,F,W --ignore=E501 || true

      - name: Syntax check bridge_api
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('bridge_api.py').read_text(encoding='utf-8'))"

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    needs: [test-governed, test-ml-avm, test-root-integration, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Set kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig

      - name: Update image tag
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl set image deployment/expert-smart-api \
            api=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n expert-smart

      - name: Wait for rollout
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl rollout status deployment/expert-smart-api \
            -n expert-smart --timeout=300s
